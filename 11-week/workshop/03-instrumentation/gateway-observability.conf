js_import trace from /etc/nginx/njs/gateway-trace-context.mjs;

js_set $gateway_trace_id trace.gatewayTraceId;
js_set $gateway_response_traceparent trace.gatewayResponseTraceparent;
js_set $gateway_upstream_traceparent trace.gatewayUpstreamTraceparent;

# Include this before the catalog proxy_pass locations.
proxy_set_header X-Correlation-Id $gateway_trace_id;
proxy_set_header traceparent $gateway_upstream_traceparent;
add_header traceparent $gateway_response_traceparent always;

# /metrics is internal-only. A production implementation renders the two
# gateway metrics from an njs shared dictionary or a Prometheus exporter.
location = /metrics {
    internal;
    default_type text/plain;
}
